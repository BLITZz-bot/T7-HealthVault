version: 2
updates:
  # 1. Maintain GitHub Actions CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # 2. Maintain Flutter & Dart packages
  - package-ecosystem: "pub"
    directory: "/flutter_app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # 3. Maintain Python Machine Learning dependencies
  - package-ecosystem: "pip"
    directory: "/model_pipeline"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
